# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: lineup-manager
metadata:
  template: lineup-manager@1.0.0
# One static web app (Free) serves the single-page app at the root and the
