<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lineup Manager has moved</title>
  <meta http-equiv="refresh" content="0; url=https://happy-field-051df6c0f.5.azurestaticapps.net">
  <style>
    :root{
      --bg:#0b3d2e; --bg2:#0f5138; --accent:#159c5b; --accent-d:#0d7a45;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(160deg,var(--bg),var(--bg2));
      color:#eafff4; line-height:1.4;
      display:flex; align-items:center; justify-content:center;
      padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    }
    .card{
      max-width:520px; width:100%; text-align:center;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
      border-radius:18px; padding:32px 24px;
    }
    h1{font-size:26px; margin:0 0 8px}
    p{font-size:17px; color:#cdeadd; margin:10px 0}
    a.go{
      display:block; margin:22px auto 8px; padding:18px 22px;
      background:var(--accent); color:#fff; text-decoration:none;
      font-size:19px; font-weight:700; border-radius:14px;
      border:1px solid var(--accent-d);
      word-break:break-all;
    }
    a.go:active{background:var(--accent-d)}
    .url{font-size:14px; color:#a9d6c3; word-break:break-all; margin-top:4px}
    .bookmark{font-size:14px; color:#9fcdb9; margin-top:18px}
  </style>
</head>
<body>
  <div class="card">
    <h1>⚽ Lineup Manager has moved</h1>
    <p>This app now lives at its new home. If you're not redirected automatically, tap below.</p>
    <a class="go" href="https://happy-field-051df6c0f.5.azurestaticapps.net">Open the app →</a>
    <div class="url">https://happy-field-051df6c0f.5.azurestaticapps.net</div>
    <p class="bookmark">Please <strong>bookmark the new URL</strong> (or re-add it to your Home Screen).</p>
  </div>
  <script>
    location.replace("https://happy-field-051df6c0f.5.azurestaticapps.net");
  </script>
</body>
</html>
